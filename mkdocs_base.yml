  - static/css/version-selector.css
  - static/css/substring-search.css  # 子串模糊检索结果样式 + 历史搜索区样式
  - static/css/inpage-find.css       # 页内查找条（Ctrl+F 风格）样式
  # - static/css/no-flash.css   # 消除 instant 导航白屏（淡入淡出），需在 extra.css 之后加载-已删除伪元素
extra_javascript:
  - static/js/custom.js
  - static/js/substring-search.js  # 子串模糊检索（在 custom.js 之后，复用其搜索弹窗打开逻辑）
  - static/js/inpage-find.js       # 页内查找条（Ctrl+F / 命中页 ?h= 自动唤起）
  - static/js/version-selector.js
  - static/js/code-highlight.js
  - static/js/wavedrom-skin.js
  - static/js/wavedrom.min.js
  - static/js/wavedrom-init.js
  - static/js/no-flash.js     # 必须最后加载：接管 instant 生命周期、提前渲染波形，覆盖前述脚本带来的视觉延迟